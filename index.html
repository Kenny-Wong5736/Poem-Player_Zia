@font-face{font-family:Poem;src:local("FZLanTingHeiS-R-GB"),local("STKaiti")}*{box-sizing:border-box}body{margin:0;color:#25342d;background:#e8eee8;font-family:Poem,"Kaiti SC","Microsoft YaHei",sans-serif}.bg{position:fixed;inset:0;background-position:center;background-size:cover;transition:.5s;filter:saturate(.88)}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(#f7f3e8a8,#e9efe7dc)}header{position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 14px 10px}button,input,select{border:1px solid #ffffff90;background:#fffdf2e8;border-radius:16px;min-height:46px;padding:9px 13px;font-size:16px}h1{font-size:20px}.search{margin-left:auto;width:min(360px,38vw)}main{position:relative;z-index:2;display:grid;place-items:center;padding:8px 14px 20px}.card{width:min(780px,100%);min-height:620px;padding:28px 28px 12px;border-radius:30px;background:#fffdf1d9;backdrop-filter:blur(12px);box-shadow:0 18px 50px #263a2d35;text-align:center;display:flex;flex-direction:column}.title{font-size:37px;margin:12px 0 4px}.meta{color:#6d725f}.poem{margin:auto;white-space:pre-line;font-family:"Kaiti SC","STKaiti",Poem,sans-serif;font-size:27px;line-height:2.05;letter-spacing:2px;text-shadow:0 1px #fff}.bar{width:100%;accent-color:#69806e}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.primary{background:#69806e;color:white}.small{color:#647067;font-size:13px}.overlay{display:none;position:fixed;inset:0;background:#0005;z-index:8}.overlay.on{display:block}.panel{position:fixed;z-index:9;background:#fffdf4f7;backdrop-filter:blur(14px);box-shadow:0 10px 35px #0003}.drawer{left:0;top:0;bottom:0;width:min(370px,90vw);padding:22px;transform:translateX(-105%);transition:.25s;display:flex;flex-direction:column}.drawer.on{transform:none}.settings{right:12px;top:78px;width:min(330px,92vw);padding:20px;border-radius:22px;display:none}.settings.on{display:block}.list{overflow:auto;margin-top:10px}.item{width:100%;display:block;text-align:left;border:0;background:transparent}.item.active{background:#69806e;color:white}.setting{display:flex;justify-content:space-between;align-items:center;margin:13px 0}.setting input{width:22px}.times{font:13px sans-serif;display:flex;align-items:center;gap:8px}.times .bar{flex:1}@media(max-width:650px){header{flex-wrap:wrap}h1{margin:0}.search{order:3;width:100%;margin:0}main{padding:4px 8px 12px}.card{min-height:calc(100dvh - 128px);padding:19px 12px 8px}.title{font-size:31px}.poem{font-size:clamp(21px,6.2vw,27px);line-height:1.9}.controls button{flex:1 1 29%}}
</style></head><body><div id="bg" class="bg"></div><header><button id="menu">☰ 目录</button><h1>古诗朗读 V4.1</h1><input id="search" class="search" placeholder="搜索诗名或作者"><button id="gear">⚙ 设置</button></header><main><section class="card"><div id="count" class="small"></div><h2 id="title" class="title"></h2><div id="meta" class="meta"></div><div id="poem" class="poem"></div><div class="times"><span id="now">00:00</span><input id="progress" class="bar" type="range" min="0" max="100" value="0"><span id="dur">00:00</span></div><div class="controls"><button id="prev">上一首</button><button id="play" class="primary">▶ 播放</button><button id="next">下一首</button></div><div id="status" class="small">MP3模式。首次请点击播放。</div></section></main><audio id="audio" preload="metadata"></audio><div id="cover" class="overlay"></div><aside id="drawer" class="panel drawer"><h2>古诗目录</h2><input id="dsearch" placeholder="搜索诗名或作者"><nav id="list" class="list"></nav></aside><aside id="settings" class="panel settings"><h2>播放设置</h2><label class="setting"><span>列表循环</span><input id="listLoop" type="checkbox" checked></label><label class="setting"><span>单首循环</span><input id="oneLoop" type="checkbox"></label><label class="setting"><span>语速</span><select id="rate"><option value="0.75">0.75× 慢</option><option value="0.9">0.90×</option><option value="1" selected>1.00× 标准</option><option value="1.1">1.10×</option><option value="1.25">1.25× 快</option></select></label><button id="closeSettings">完成</button></aside><script>
const poems=[{"title": "悯农（其二）", "dynasty": "唐", "author": "李绅", "text": "锄禾日当午，\n汗滴禾下土。\n谁知盘中餐，\n粒粒皆辛苦。", "audio": "audio/01.mp3"}, {"title": "池上", "dynasty": "唐", "author": "白居易", "text": "小娃撑小艇，\n偷采白莲回。\n不解藏踪迹，\n浮萍一道开。", "audio": "audio/02.mp3"}, {"title": "小池", "dynasty": "宋", "author": "杨万里", "text": "泉眼无声惜细流，\n树阴照水爱晴柔。\n小荷才露尖尖角，\n早有蜻蜓立上头。", "audio": "audio/03.mp3"}, {"title": "小儿垂钓", "dynasty": "唐", "author": "胡令能", "text": "蓬头稚子学垂纶，\n侧坐莓苔草映身。\n路人借问遥招手，\n怕得鱼惊不应人。", "audio": "audio/04.mp3"}, {"title": "江雪", "dynasty": "唐", "author": "柳宗元", "text": "千山鸟飞绝，\n万径人踪灭。\n孤舟蓑笠翁，\n独钓寒江雪。", "audio": "audio/05.mp3"}, {"title": "敕勒歌", "dynasty": "北朝民歌", "author": "佚名", "text": "敕勒川，阴山下。\n天似穹庐，笼盖四野。\n天苍苍，野茫茫，\n风吹草低见牛羊。", "audio": "audio/06.mp3"}, {"title": "村居", "dynasty": "清", "author": "高鼎", "text": "草长莺飞二月天，\n拂堤杨柳醉春烟。\n儿童散学归来早，\n忙趁东风放纸鸢。", "audio": "audio/07.mp3"}, {"title": "悯农（其一）", "dynasty": "唐", "author": "李绅", "text": "春种一粒粟，\n秋收万颗子。\n四海无闲田，\n农夫犹饿死。", "audio": "audio/08.mp3"}, {"title": "所见", "dynasty": "清", "author": "袁枚", "text": "牧童骑黄牛，\n歌声振林樾。\n意欲捕鸣蝉，\n忽然闭口立。", "audio": "audio/09.mp3"}, {"title": "元日", "dynasty": "宋", "author": "王安石", "text": "爆竹声中一岁除，\n春风送暖入屠苏。\n千门万户曈曈日，\n总把新桃换旧符。", "audio": "audio/10.mp3"}, {"title": "清明", "dynasty": "唐", "author": "杜牧", "text": "清明时节雨纷纷，\n路上行人欲断魂。\n借问酒家何处有？\n牧童遥指杏花村。", "audio": "audio/11.mp3"}, {"title": "九月九日忆山东兄弟", "dynasty": "唐", "author": "王维", "text": "独在异乡为异客，\n每逢佳节倍思亲。\n遥知兄弟登高处，\n遍插茱萸少一人。", "audio": "audio/12.mp3"}, {"title": "四时田园杂兴（其二十五）", "dynasty": "宋", "author": "范成大", "text": "梅子金黄杏子肥，\n麦花雪白菜花稀。\n日长篱落无人过，\n惟有蜻蜓蛱蝶飞。", "audio": "audio/13.mp3"}, {"title": "渔歌子", "dynasty": "唐", "author": "张志和", "text": "西塞山前白鹭飞，\n桃花流水鳜鱼肥。\n青箬笠，绿蓑衣，\n斜风细雨不须归。", "audio": "audio/14.mp3"}, {"title": "四时田园杂兴（其三十一）", "dynasty": "宋", "author": "范成大", "text": "昼出耘田夜绩麻，\n村庄儿女各当家。\n童孙未解供耕织，\n也傍桑阴学种瓜。", "audio": "audio/15.mp3"}, {"title": "乡村四月", "dynasty": "宋", "author": "翁卷", "text": "绿遍山原白满川，\n子规声里雨如烟。\n乡村四月闲人少，\n才了蚕桑又插田。", "audio": "audio/16.mp3"}, {"title": "长歌行", "dynasty": "汉乐府", "author": "佚名", "text": "青青园中葵，朝露待日晞。\n阳春布德泽，万物生光辉。\n常恐秋节至，焜黄华叶衰。\n百川东到海，何时复西归？\n少壮不努力，老大徒伤悲！", "audio": "audio/17.mp3"}, {"title": "江上渔者", "dynasty": "宋", "author": "范仲淹", "text": "江上往来人，\n但爱鲈鱼美。\n君看一叶舟，\n出没风波里。", "audio": "audio/18.mp3"}],$=x=>document.getElementById(x),a=$('audio');let idx=+(localStorage.poemIndex||0),query='';let cfg=JSON.parse(localStorage.poemCfg||'{"listLoop":true,"oneLoop":false,"rate":1}');const fmt=s=>!isFinite(s)?'00:00':String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
function save(){localStorage.poemIndex=idx;localStorage.poemCfg=JSON.stringify(cfg)}function matches(p){const q=query.trim().toLowerCase();return !q||(p.title+p.author).toLowerCase().includes(q)}function list(){const box=$('list');box.innerHTML='';poems.forEach((p,n)=>{if(!matches(p))return;const b=document.createElement('button');b.className='item'+(n===idx?' active':'');b.textContent=`${n+1}. ${p.title} · ${p.author}`;b.onclick=()=>{select(n,true);closePanels()};box.appendChild(b)})}function session(){if(!('mediaSession'in navigator))return;const p=poems[idx];navigator.mediaSession.metadata=new MediaMetadata({title:p.title,artist:`${p.dynasty} · ${p.author}`,album:'古诗朗读 V4.1',artwork:[{src:'icon-192.png',sizes:'192x192',type:'image/png'},{src:'icon-512.png',sizes:'512x512',type:'image/png'}]})}function render(){const p=poems[idx];$('count').textContent=`第 ${idx+1} 首 / 共 ${poems.length} 首`;$('title').textContent=p.title;$('meta').textContent=`${p.dynasty} · ${p.author}`;$('poem').textContent=p.text;$('bg').style.backgroundImage=`url(backgrounds/${String(idx+1).padStart(2,'0')}.jpg)`;list();session();save()}function select(n,go=false){idx=(n+poems.length)%poems.length;a.src=poems[idx].audio;a.playbackRate=cfg.rate;a.load();render();if(go)a.play().catch(()=>status('请先点击播放按钮授权音频。'))}function status(t){$('status').textContent=t}function closePanels(){$('drawer').classList.remove('on');$('settings').classList.remove('on');$('cover').classList.remove('on')}function toggle(){a.paused?a.play().catch(()=>status('请点击播放按钮授权音频。')):a.pause()}
$('menu').onclick=()=>{$('drawer').classList.add('on');$('cover').classList.add('on')};$('gear').onclick=()=>{$('settings').classList.add('on');$('cover').classList.add('on')};$('cover').onclick=closePanels;$('closeSettings').onclick=closePanels;$('play').onclick=toggle;$('prev').onclick=()=>select(idx-1,true);$('next').onclick=()=>select(idx+1,true);$('search').oninput=e=>{query=e.target.value;$('dsearch').value=query;list()};$('dsearch').oninput=e=>{query=e.target.value;$('search').value=query;list()};$('progress').oninput=e=>{if(a.duration)a.currentTime=a.duration*e.target.value/100};$('listLoop').checked=cfg.listLoop;$('oneLoop').checked=cfg.oneLoop;$('rate').value=cfg.rate;$('listLoop').onchange=e=>{cfg.listLoop=e.target.checked;save()};$('oneLoop').onchange=e=>{cfg.oneLoop=e.target.checked;save()};$('rate').onchange=e=>{cfg.rate=+e.target.value;a.playbackRate=cfg.rate;save()};a.onplay=()=>{$('play').textContent='❚❚ 暂停';status('正在播放：'+poems[idx].title);if(navigator.mediaSession)navigator.mediaSession.playbackState='playing'};a.onpause=()=>{$('play').textContent='▶ 播放';if(navigator.mediaSession)navigator.mediaSession.playbackState='paused'};a.ontimeupdate=()=>{$('progress').value=a.duration?a.currentTime/a.duration*100:0;$('now').textContent=fmt(a.currentTime);$('dur').textContent=fmt(a.duration);if(navigator.mediaSession?.setPositionState&&a.duration)try{navigator.mediaSession.setPositionState({duration:a.duration,playbackRate:a.playbackRate,position:a.currentTime})}catch(e){}};a.onended=()=>cfg.oneLoop?(a.currentTime=0,a.play()):(idx<poems.length-1?select(idx+1,true):cfg.listLoop&&select(0,true));
if('mediaSession'in navigator){for(const [k,v] of Object.entries({play:()=>a.play(),pause:()=>a.pause(),previoustrack:()=>select(idx-1,true),nexttrack:()=>select(idx+1,true),seekbackward:e=>a.currentTime=Math.max(0,a.currentTime-(e.seekOffset||10)),seekforward:e=>a.currentTime=Math.min(a.duration||0,a.currentTime+(e.seekOffset||10)),stop:()=>{a.pause();a.currentTime=0}}))try{navigator.mediaSession.setActionHandler(k,v)}catch(e){}}
select(idx,false);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
